    url: https://www.sciencedaily.com/rss/matter_energy/chemistry.xml
    type: rss
    enabled: false
    disabled_reason: not India-specific (verified working — 30 items)

  - university_name: Phys.org
    url: https://phys.org/rss-feed/chemistry-news/
    type: rss
    enabled: false
    disabled_reason: not India-specific (verified working — 30 items)

# Grant sources use official public APIs rather than scraping.
#
# IMPORTANT: NIH and NSF fund US institutions almost exclusively, so they
# contribute nothing to an India-targeted run and are excluded from the default
# source set (see discoveryOrchestrator.ts). They remain available for a
# `global` run. India's own funders (SERB, DST, CSIR) publish no comparable
# public API — adding them would mean scraping, which is why Indian grant data
# is not currently a source.
grants:
  - name: NIH RePORTER
    api: https://api.reporter.nih.gov/v2/projects/search
    method: POST
    enabled: true
    note: US-funded PIs only — excluded from India-targeted runs

  - name: NSF Award Search
    api: https://www.research.gov/awardapi-service/v1/awards.json
    method: GET
    enabled: true
    note: US-funded PIs only — excluded from India-targeted runs
