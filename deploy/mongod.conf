# MongoDB for Classone-Discovery: reachable only from this machine, with a cache sized for a
# 2–4 GB VM that also runs Chromium and Node (MongoDB's default would claim half the RAM).
storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.4

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 127.0.0.1

processManagement:
  timeZoneInfo: /usr/share/zoneinfo
